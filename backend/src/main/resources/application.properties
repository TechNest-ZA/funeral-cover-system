spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/funeral_cover?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

# Fake pay mode: when true, /api/payments/initiate immediately marks the
# payment successful instead of redirecting to PayFast. Flip to false once
# PayFast sandbox is wired up.
app.payments.fake-pay=true

# JWT signing secret for admin auth (HS256, needs to be >= 32 bytes). This is
# a dev-only secret checked into the repo for local testing - replace it with
# an env-injected value before any real deployment.
app.jwt.secret=Jqx0Fis8O8BxUQ9NMGnruZiDOx932brlxq3b2l3wRjR2EEYrN8chq86MxE3YVXTb
app.jwt.expiration-ms=28800000

# Default admin user, created on first startup if admin_user is empty.
app.admin.seed.username=admin
app.admin.seed.password=ChangeMe123!

# Base URL of the public frontend, used to build funeral-QR signup links.
app.public-base-url=http://localhost:5177
