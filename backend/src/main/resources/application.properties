spring.application.name=backend

# Local dev default; a real host (Railway etc.) sets SPRING_DATASOURCE_URL /
# _USERNAME / _PASSWORD directly as env vars, which Spring Boot's relaxed
# binding picks up automatically and which take priority over these.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/funeral_cover?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Most hosts (Railway included) assign the port via $PORT rather than letting
# the app pick one.
server.port=${PORT:8080}

# Comma-separated list of allowed CORS origin patterns. Local dev default
# covers every localhost port; a real host sets this to the actual deployed
# frontend origin(s).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# Fake pay mode: when true, /api/payments/initiate immediately marks the
# payment successful instead of redirecting to PayFast. Flip to false once
# PayFast sandbox is wired up.
app.payments.fake-pay=true

# JWT signing secret for admin auth (HS256, needs to be >= 32 bytes). Read
# from the JWT_SECRET env var - set it before starting the backend. The
# fallback below is an obvious placeholder, not a real secret, so a missing
# env var is immediately visible rather than silently working with a
# leaked key.
app.jwt.secret=${JWT_SECRET:SET_JWT_SECRET_ENV_VAR_BEFORE_STARTING}
app.jwt.expiration-ms=28800000

# Default admin user, created on first startup if admin_user is empty (does
# NOT reset an existing account's password - see memory/ops notes for how
# to rotate an already-seeded admin password).
app.admin.seed.username=admin
app.admin.seed.password=${ADMIN_SEED_PASSWORD:SET_ADMIN_SEED_PASSWORD_ENV_VAR}

# Base URL of the public frontend, used to build funeral-QR signup links.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:5177}

# Chatbot (Claude): answers marketing-site visitors from real plan/FAQ data,
# grounded via a system prompt so it can't invent benefits or prices - see
# ChatService. Read from the ANTHROPIC_API_KEY env var, same pattern as
# JWT_SECRET - set it before starting the backend. Empty means the chat
# feature is off (503 on every request) rather than failing per-call.
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=claude-haiku-4-5
